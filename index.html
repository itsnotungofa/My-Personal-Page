<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ungofa</title>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0a1a;--fg:#b9b3d6;--accent:#ff4d6d;--accent2:#5ce1e6;--line:#2a2347;--card:#16112b;--strong:#f1eeff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Ubuntu",system-ui,sans-serif;line-height:1.6;font-size:17px;display:flex;flex-direction:column}
nav.tabs{display:flex;justify-content:center;gap:8px;padding:20px 16px 0;border-bottom:1px solid var(--line)}
nav.tabs a{padding:10px 22px;color:var(--fg);text-decoration:none;font-weight:700;letter-spacing:.06em;border-bottom:3px solid transparent;margin-bottom:-1px}
nav.tabs a:hover{color:var(--strong)}
nav.tabs a[aria-current="page"]{color:var(--accent2);border-bottom-color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}
.view{display:none;flex:1;align-items:center;justify-content:center}
.view.on{display:flex}
section{width:100%;max-width:440px;padding:40px 24px;text-align:center}
img{width:140px;height:140px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);box-shadow:0 0 0 8px rgba(255,77,109,.14)}
h1{margin:28px 0 0;font-size:clamp(2.8rem,12vw,4.2rem);line-height:1.1;color:var(--accent);font-weight:700}
h2{margin:0 0 12px;font-size:1.8rem;color:var(--accent2)}
.desc{margin:12px 0 36px}
.links{display:grid;gap:12px;text-align:left}
.links a,.links .item{display:flex;justify-content:space-between;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;color:var(--strong);text-decoration:none;transition:border-color .15s,color .15s}
.links a:hover{border-color:var(--accent2);color:var(--accent2)}
.links small{color:var(--fg);font-size:.9rem;overflow-wrap:anywhere;text-align:right}
</style>
</head>
